name: Upload Website

on:
  push:
    branches:
    - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
    
    - name: Sync S3 bucket
      uses: jakejarvis/s3-sync-action@master
      with:
        args: --acl public-read --follow-symlinks --delete
      env:
        AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: 'us-east-1'
        SOURCE_DIR: 'frontend'
    
    - name: Set agents.md content type
      run: |
        aws s3 cp s3://${{ secrets.AWS_S3_BUCKET }}/agents.md \
                  s3://${{ secrets.AWS_S3_BUCKET }}/agents.md \
                  --content-type "text/markdown; charset=utf-8" \
                  --cache-control "public, max-age=300, must-revalidate" \
                  --metadata-directive REPLACE \
                  --acl public-read
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: 'us-east-1'

    - name: Set Cache-Control and Content-Type on HTML files
      run: |
        for key in index.html blog.html; do
          aws s3 cp s3://${{ secrets.AWS_S3_BUCKET }}/$key \
                    s3://${{ secrets.AWS_S3_BUCKET }}/$key \
                    --content-type "text/html; charset=utf-8" \
                    --cache-control "public, max-age=300, must-revalidate" \
                    --metadata-directive REPLACE \
                    --acl public-read
        done
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: 'us-east-1'

    - name: Set Cache-Control and Content-Type on XML and text files
      run: |
        aws s3 cp s3://${{ secrets.AWS_S3_BUCKET }}/sitemap.xml \
                  s3://${{ secrets.AWS_S3_BUCKET }}/sitemap.xml \
                  --content-type "application/xml" \
                  --cache-control "public, max-age=300, must-revalidate" \
                  --metadata-directive REPLACE \
                  --acl public-read
        aws s3 cp s3://${{ secrets.AWS_S3_BUCKET }}/robots.txt \
                  s3://${{ secrets.AWS_S3_BUCKET }}/robots.txt \
                  --content-type "text/plain; charset=utf-8" \
                  --cache-control "public, max-age=300, must-revalidate" \
                  --metadata-directive REPLACE \
                  --acl public-read
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: 'us-east-1'

    - name: Set long Cache-Control on CSS and JS
      run: |
        aws s3 cp s3://${{ secrets.AWS_S3_BUCKET }}/css/ \
                  s3://${{ secrets.AWS_S3_BUCKET }}/css/ \
                  --recursive \
                  --cache-control "public, max-age=86400" \
                  --content-type "text/css; charset=utf-8" \
                  --metadata-directive REPLACE \
                  --acl public-read
        aws s3 cp s3://${{ secrets.AWS_S3_BUCKET }}/js/ \
                  s3://${{ secrets.AWS_S3_BUCKET }}/js/ \
                  --recursive \
                  --cache-control "public, max-age=86400" \
                  --content-type "application/javascript; charset=utf-8" \
                  --metadata-directive REPLACE \
                  --acl public-read
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: 'us-east-1'

    - name: Invalidate CloudFront cache
      uses: chetan/invalidate-cloudfront-action@v2
      env:
        DISTRIBUTION: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        PATHS: '/*'
        AWS_REGION: 'us-east-1'
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    - name: Smoke test — verify site is reachable and renders as HTML
      run: |
        echo "Waiting 15s for CloudFront invalidation to propagate..."
        sleep 15

        STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://www.clouddani.com/index.html)
        CONTENT_TYPE=$(curl -sI https://www.clouddani.com/index.html | grep -i "^content-type:" | tr -d '\r')

        echo "HTTP status:  $STATUS"
        echo "Content-Type: $CONTENT_TYPE"

        if [ "$STATUS" != "200" ]; then
          echo "FAIL: expected HTTP 200, got $STATUS"
          exit 1
        fi

        if echo "$CONTENT_TYPE" | grep -qiv "text/html"; then
          echo "FAIL: Content-Type is not text/html — got: $CONTENT_TYPE"
          echo "Site will download instead of render. Check S3 metadata."
          exit 1
        fi

        BODY=$(curl -s https://www.clouddani.com/index.html | head -5)
        if ! echo "$BODY" | grep -qi "<!doctype html\|<html"; then
          echo "FAIL: response body does not look like HTML"
          exit 1
        fi

        echo "OK: site is live, Content-Type is correct, HTML is rendering."
