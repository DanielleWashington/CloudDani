name: Upload Website

on:
  push:
    branches:
    - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
    
    - name: Sync S3 bucket
      uses: jakejarvis/s3-sync-action@master
      with:
        args: --acl public-read --follow-symlinks --delete
      env:
        AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: 'us-east-1'
        SOURCE_DIR: 'frontend'
    
    - name: Set agents.md content type
      run: |
        aws s3 cp s3://${{ secrets.AWS_S3_BUCKET }}/agents.md \
                  s3://${{ secrets.AWS_S3_BUCKET }}/agents.md \
                  --content-type "text/markdown; charset=utf-8" \
                  --cache-control "public, max-age=300, must-revalidate" \
                  --metadata-directive REPLACE \
                  --acl public-read
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: 'us-east-1'

    - name: Set short Cache-Control on HTML, sitemap, robots
      run: |
        for key in index.html blog.html cosmic-mockup.html sitemap.xml robots.txt; do
          aws s3 cp s3://${{ secrets.AWS_S3_BUCKET }}/$key \
                    s3://${{ secrets.AWS_S3_BUCKET }}/$key \
                    --cache-control "public, max-age=300, must-revalidate" \
                    --metadata-directive REPLACE \
                    --acl public-read
        done
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: 'us-east-1'

    - name: Set long Cache-Control on CSS and JS
      run: |
        aws s3 cp s3://${{ secrets.AWS_S3_BUCKET }}/css/ \
                  s3://${{ secrets.AWS_S3_BUCKET }}/css/ \
                  --recursive \
                  --cache-control "public, max-age=86400" \
                  --metadata-directive REPLACE \
                  --acl public-read
        aws s3 cp s3://${{ secrets.AWS_S3_BUCKET }}/js/ \
                  s3://${{ secrets.AWS_S3_BUCKET }}/js/ \
                  --recursive \
                  --cache-control "public, max-age=86400" \
                  --metadata-directive REPLACE \
                  --acl public-read
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: 'us-east-1'

    - name: Invalidate CloudFront cache
      uses: chetan/invalidate-cloudfront-action@v2
      env:
        DISTRIBUTION: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        PATHS: '/*'
        AWS_REGION: 'us-east-1'
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
